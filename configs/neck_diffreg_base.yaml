seed: 1234

model:
  image_channels: 1
  tissue_channels: 0
  base_channels: 4
  num_skeleton_nodes: 10
  velocity_integration_steps: 3
  integration_steps: 3
  residual_velocity_scale: 0.15

data:
  mode: synthetic
  num_samples: 4
  spatial_shape: [12, 12, 12]
  num_blobs: 4
  displacement_scale: 0.05
  include_segmentation: true
  enable_corruption: true
  corruption_probability: 0.75
  num_corruptions: 2
  seed: 2026

training:
  device: cpu
  batch_size: 1
  learning_rate: 0.001
  max_iters: 2
  output_dir: outputs/checkpoints

loss:
  similarity: weighted_mse
  ncc_window_size: 5
  reliability_mean_target: 0.75
  tissue_aware_smoothness: false
  tissue_channel_weights: [2.0, 1.0, 1.0, 0.5, 0.5, 1.0, 0.3]
  weights:
    similarity: 1.0
    smoothness: 0.05
    jacobian: 0.01
    reliability_tv: 0.02
    reliability_sparsity: 0.01
    reliability_mean_prior: 0.01
    segmentation: 0.1
    skeleton: 0.001
    uncertainty: 0.0
