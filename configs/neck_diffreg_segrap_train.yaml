seed: 1234

model:
  image_channels: 1
  tissue_channels: 0
  base_channels: 4
  num_skeleton_nodes: 1
  velocity_integration_steps: 4
  integration_steps: 4
  residual_velocity_scale: 0.08

data:
  mode: segrap
  root: data
  split: train
  list_path: data/lists/trn_list_inter.txt
  expected_shape: [160, 160, 192]
  validate_shapes: true
  validate_image_range: true
  pairs_per_epoch: 64
  pair_stride: 1
  num_workers: 0
  pin_memory: false

training:
  device: cpu
  batch_size: 1
  learning_rate: 0.0001
  max_iters: 100
  log_interval: 10
  output_dir: outputs/checkpoints
  checkpoint_name: neck_diffreg_segrap_train.pt

loss:
  similarity: weighted_mse
  ncc_window_size: 5
  reliability_mean_target: 0.75
  tissue_aware_smoothness: false
  tissue_channel_weights: [2.0, 1.0, 1.0, 0.5, 0.5, 1.0, 0.3]
  weights:
    similarity: 1.0
    smoothness: 0.05
    jacobian: 0.01
    reliability_tv: 0.02
    reliability_sparsity: 0.01
    reliability_mean_prior: 0.01
    segmentation: 0.05
    skeleton: 0.001
    uncertainty: 0.0
